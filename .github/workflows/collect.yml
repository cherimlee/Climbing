name: collect-somoim

on:
  schedule:
    - cron: "30 0 * * *"   # 09:30 KST 기상 → 09:56 수집
    - cron: "30 8 * * *"   # 17:30 KST 기상 → 17:56 수집
  workflow_dispatch:
    inputs:
      start_at:
        description: "수집 시작 시각 (now / auto / HH:MM KST)"
        default: "now"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: climbing-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect.py
        env:
          START_AT: ${{ github.event.inputs.start_at || 'auto' }}
          WORKERS: "4"
          REQUEST_DELAY: "1.0"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add docs
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: climbing-report/docs
      - id: deploy
        uses: actions/deploy-pages@v4
