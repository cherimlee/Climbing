name: collect-somoim

on:
  # 정시 실행은 Cloudflare 워커 크론(worker.js)이 workflow_dispatch로 깨움.
  # 아래 GitHub 예약은 예비용: GitHub 예약은 몇 시간씩 늦거나 건너뛸 수 있음.
  schedule:
    - cron: "30 0 * * *"   # 09:30 KST 기상 → 09:56 수집
    - cron: "50 0 * * *"   # 09:50 KST 예비
    - cron: "30 8 * * *"   # 17:30 KST 기상 → 17:56 수집
    - cron: "50 8 * * *"   # 17:50 KST 예비
  workflow_dispatch:
    inputs:
      start_at:
        description: "수집 시작 시각 (now / auto / HH:MM KST)"
        default: "now"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: climbing-report
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 예약 실행은 예약된 시점의 커밋을 받음. 앞 실행이 올린 결과 위에서 시작하도록 최신 main을 받음
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Find new climbing crews (하루 한 번)
        run: python discover_crews.py
        continue-on-error: true   # 실패해도 기존 crews.json으로 수집은 계속
      - run: python collect.py
        env:
          START_AT: ${{ github.event.inputs.start_at || 'auto' }}
          NEW_EVENTS_FILE: ${{ runner.temp }}/new_events.json   # 충돌 시 다시 병합할 때 씀
          WORKERS: "4"
          REQUEST_DELAY: "1.0"
      - name: Commit results
        env:
          NEW_EVENTS_FILE: ${{ runner.temp }}/new_events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 수집 중에 다른 실행이 같은 날짜 파일을 올렸으면, 최신 main으로 맞춘 뒤
          # 이번에 받은 정모(NEW_EVENTS_FILE)만 다시 병합해서 올림 (충돌 없이 둘 다 반영)
          for i in 1 2 3 4 5; do
            git add docs crews.json crews_discovered.txt
            git diff --cached --quiet && exit 0
            git commit -q -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
            git push && exit 0
            sleep $((i * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            START_AT=now python collect.py
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: climbing-report/docs
      - id: deploy
        uses: actions/deploy-pages@v4
