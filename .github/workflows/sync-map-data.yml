name: sync-map-data

# climbing_gyms.json(암장 원본)이 바뀌면 map.html 안의 암장 데이터와 gyms.json을 다시 만들어 커밋
on:
  push:
    branches: [main]
    paths:
      - climbing-report/docs/data/climbing_gyms.json
      - climbing-report/sync_map_data.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-map-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: climbing-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sync_map_data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/map.html gyms.json
          git diff --cached --quiet && exit 0
          git commit -m "map: 암장 데이터 동기화 (climbing_gyms.json)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
