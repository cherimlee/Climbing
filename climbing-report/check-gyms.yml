name: check-gyms

# 암장 정보 정기 점검 → 후보를 climbing-report/checks/ 에 보고서로 저장 + GitHub 이슈로 알림
# (DB는 고치지 않음. 확인 후 반영)
# 정시 실행은 Cloudflare 워커 크론(worker.js, 09:30 KST)이 workflow_dispatch로 깨움.
# 아래 GitHub 예약은 예비용: GitHub 예약은 몇 시간씩 늦거나 건너뛸 수 있음. 이미 점검했으면 바로 종료.
on:
  schedule:
    # GitHub cron은 UTC 기준(KST = UTC+9).
    - cron: "17 5 25 * *"    # 매월 25일 14:17 KST — 월간 점검
    - cron: "17 5 15 12 *"   # 12월 15일 14:17 KST — 연말연시 점검
    - cron: "17 5 * * 1"     # 매주 월요일 14:17 KST — 설·추석 연휴 8~14일 전이면 명절 점검(아니면 바로 종료)
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      mode:
        description: "점검 종류"
        type: choice
        default: monthly
        options: [monthly, holiday, yearend, auto]
      schedule:
        description: "auto일 때 어느 예약인지 (워커가 채움, 비워 두면 날짜로 판단)"
        default: ""

permissions:
  contents: write            # 보고서 커밋
  issues: write              # 알림 이슈 만들기

concurrency:
  group: check-gyms
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: climbing-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python check_gyms.py
        env:
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          SCHEDULE: ${{ github.event.schedule || github.event.inputs.schedule }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks 2>/dev/null || exit 0      # 명절 점검 시기가 아니면 보고서 없음
          git diff --cached --quiet && exit 0
          git commit -m "check: $(TZ=Asia/Seoul date +'%Y-%m-%d') 암장 정보 점검"
          # 같은 때 sync-map-data·collect가 커밋해도 밀리지 않게 재시도
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
