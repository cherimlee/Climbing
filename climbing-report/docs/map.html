<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서울·경기 암장 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 화면 전체가 3D 디오라마, 그 위에 떠 있는 칩·카드·서랍형 정보 패널 */
:root{
  color-scheme: light;
  --ink:#1b2144;          /* 초크 묻은 남색 */
  --ink-soft:#4a5078;
  --paper:#ffffff;
  --chalk:#f3f5ff;        /* 초크 가루 흰색 */
  --line:#dfe3f5;
  --hold-red:#ff5a5f; --hold-orange:#ff8c42; --hold-yellow:#ffc933;
  --hold-green:#22c39a; --hold-blue:#3d7bff; --hold-purple:#9b5de5; --hold-pink:#ff6fb5;
  --ok:#14a37f; --warn:#e58a00;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px;
  --shadow:0 10px 30px -12px rgba(27,33,68,.35),0 2px 6px rgba(27,33,68,.08);
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#bfe6ff;color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hold-blue);outline-offset:2px}

/* 좌상단 타이틀 카드 */
.brandcard{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:5;background:var(--paper);border-radius:var(--r);padding:12px 16px 12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.brandcard .logo{width:40px;height:40px;flex:none}
.brandcard h1{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.05;margin:0;letter-spacing:.01em}
.brandcard p{margin:3px 0 0;font-size:12px;color:var(--ink-soft)}
.brandcard b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}

/* 우상단 도구 */
.tools{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(420px,calc(100% - 32px))}
.searchbox{position:relative;width:300px;max-width:100%}
.searchbox input{width:100%;box-sizing:border-box;border:0;border-radius:999px;padding:11px 16px 11px 40px;font:500 14px var(--f-body);background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;max-height:320px;overflow:auto;margin:0;list-style:none}
.results li button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px}
.results li button:hover,.results li button:focus-visible{background:var(--chalk)}
.results small{color:var(--ink-soft);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{border:0;cursor:pointer;border-radius:999px;padding:7px 12px;font:600 12px var(--f-body);background:var(--paper);box-shadow:0 2px 8px -2px rgba(27,33,68,.25);display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:9px;height:9px;border-radius:40% 60% 55% 45%;background:var(--c,var(--ink))}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.ghost{background:rgba(255,255,255,.7)}

/* 하단 지역 스테퍼 */
.regions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:4px;background:var(--paper);border-radius:999px;padding:5px;box-shadow:var(--shadow);max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.regions button{border:0;background:transparent;border-radius:999px;padding:8px 13px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.regions button .n{font:500 11px var(--f-mono);background:var(--chalk);border-radius:99px;padding:2px 6px;color:var(--ink-soft)}
.regions button[aria-current="true"]{background:var(--hold-yellow)}
.regions button[aria-current="true"] .n{background:rgba(255,255,255,.7);color:var(--ink)}

.hint{position:fixed;left:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:4;background:rgba(27,33,68,.82);color:#fff;font-size:12px;line-height:1.55;border-radius:10px;padding:9px 12px;max-width:260px}
.listbtn{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:4}

/* 암장 라벨 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.glabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--ink);color:#fff;border-radius:10px;padding:5px 9px 5px 7px;font:600 12px var(--f-body);white-space:nowrap;display:flex;gap:6px;align-items:center;box-shadow:0 6px 14px -6px rgba(0,0,0,.5);transition:opacity .2s;will-change:transform}
.glabel::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.glabel i{width:10px;height:10px;flex:none;border-radius:40% 60% 55% 45%;background:var(--c)}
.glabel.big{font-size:15px;padding:8px 12px 8px 10px;background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.glabel.big small{display:block;font:500 11px var(--f-body);color:var(--ink-soft)}
.glabel.unv{background:#6c7194}
.ctag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--hold-yellow);color:var(--ink);font:700 12px var(--f-body);border-radius:999px;padding:5px 10px;white-space:nowrap;box-shadow:0 6px 14px -6px rgba(0,0,0,.5);z-index:10001;pointer-events:none}
.ctag::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.plabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:18px;color:rgba(27,33,68,.55);white-space:nowrap;text-align:center;line-height:1.1}
.plabel small{display:block;font:600 11px var(--f-body);color:rgba(27,33,68,.55)}

/* 정보 패널 */
.panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 24px));z-index:8;background:var(--paper);border-radius:18px;box-shadow:0 24px 60px -20px rgba(27,33,68,.55);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.panel.open{transform:none}
.panel header{flex:none;padding:18px 20px 14px;position:relative;overflow:hidden;background:var(--pc,var(--hold-yellow));}
.panel header .wall{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
.panel .eyebrow{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:center;position:relative}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:6px 0 8px;text-wrap:balance;position:relative}
.panel .close{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);cursor:pointer;display:grid;place-items:center;z-index:1}
.tags{display:flex;flex-wrap:wrap;gap:5px;position:relative}
.tag{font:600 11px var(--f-body);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 7px}
.status{font:700 11px var(--f-body);border-radius:6px;padding:3px 7px;color:#fff;background:var(--ok)}
.status.unv{background:var(--warn)}
.panel .body{overflow:auto;padding:14px 20px 22px;display:flex;flex-direction:column;gap:16px;min-height:0}
.climbmsg{display:flex;align-items:center;gap:10px;background:var(--chalk);border-radius:12px;padding:10px 12px;font-size:13px}
.climbmsg .bar{flex:1;height:8px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.climbmsg .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hold-green),var(--hold-yellow),var(--hold-red));border-radius:99px}
.climbmsg b{font-family:var(--f-mono);font-weight:500;min-width:3.5em;text-align:right}
.note{font-size:14px;line-height:1.6;margin:0}
dl.info{margin:0;display:grid;grid-template-columns:5.2em 1fr;gap:9px 12px;font-size:13.5px;line-height:1.5}
dl.info dt{color:var(--ink-soft);font-weight:600}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;color:var(--ink);font:600 13px var(--f-body);border-radius:10px;padding:10px;background:var(--chalk);box-shadow:inset 0 0 0 1px var(--line)}
.links a:hover{background:#e6eaff}
.links a.ig{background:linear-gradient(135deg,#ffd35c,#ff6fb5 55%,#9b5de5);color:#fff;box-shadow:none}
.sec h3{font:700 12px var(--f-body);letter-spacing:.06em;margin:0 0 8px;color:var(--ink-soft)}
.sources{margin:0;padding-left:18px;font-size:12px;line-height:1.6;color:var(--ink-soft)}
.sources a{color:var(--hold-blue);word-break:break-all}
.approx{font-size:12px;color:var(--ink-soft);background:#fff8e1;border-radius:8px;padding:8px 10px;line-height:1.5}

/* 목록 보기 */
.listview{position:fixed;inset:0;z-index:9;background:rgba(27,33,68,.45);display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow:auto}
.listcard{background:var(--paper);border-radius:18px;width:min(760px,100%);padding:20px 20px 24px;box-shadow:var(--shadow);box-sizing:border-box}
.listcard header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.listcard h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.listcard h3{font:700 13px var(--f-body);margin:18px 0 6px;color:var(--ink-soft)}
.listcard ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.listcard li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;background:var(--chalk);font-size:13px}
.listcard li button:hover,.listcard li button:focus-visible{background:#e6eaff}
.listcard li button i{width:10px;height:10px;border-radius:40% 60% 55% 45%;background:var(--c);flex:none}
.listcard li button small{margin-left:auto;color:var(--ink-soft);font-size:11px}

/* 지역별 암장 목록 서랍 (왼쪽) */
.rlist{position:fixed;left:16px;top:calc(92px + env(safe-area-inset-top,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100% - 32px));z-index:6;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(-100% - 24px));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.rlist.open{transform:none}
.rlist header{flex:none;padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.rlist header div{flex:1;min-width:0}
.rlist h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1;margin:0}
.rlist header p{margin:4px 0 0;font-size:12px;color:var(--ink-soft)}
.rlist header p b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.rlist .x{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--chalk);cursor:pointer;display:grid;place-items:center}
.rlist .rbody{overflow:auto;padding:6px 10px 16px;min-height:0}
.rlist h3{font:700 11px var(--f-body);letter-spacing:.06em;color:var(--ink-soft);margin:12px 6px 4px;display:flex;justify-content:space-between}
.rlist h3 span{font-family:var(--f-mono);font-weight:500}
.rlist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ritem{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:12px 1fr auto;gap:2px 9px;align-items:center;width:100%;padding:8px 8px;border-radius:10px}
.ritem:hover,.ritem:focus-visible{background:var(--chalk)}
.ritem[aria-current="true"]{background:#fff3c4;box-shadow:inset 0 0 0 2px var(--hold-yellow)}
.ritem i{width:11px;height:11px;border-radius:40% 60% 55% 45%;background:var(--c);grid-row:span 2}
.ritem .nm{font:600 13.5px var(--f-body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .sub{grid-column:2;font-size:11.5px;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .pr{font:500 11px var(--f-mono);color:var(--ink-soft);grid-row:span 2;text-align:right}
.badge{font:700 10px var(--f-body);border-radius:5px;padding:2px 5px;color:#fff;background:var(--warn);margin-left:5px;vertical-align:1px}
.badge.soon{background:#d6455d}
.rlist .empty{padding:20px 8px;font-size:13px;color:var(--ink-soft)}
body.rlist-open .hint{display:none}

/* 가까운 암장 */
.near{display:flex;flex-direction:column;gap:4px}
.near button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--chalk);font-size:13px}
.near button:hover,.near button:focus-visible{background:#e6eaff}
.near button i{width:10px;height:10px;border-radius:40% 60% 55% 45%;background:var(--c);flex:none}
.near button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.near button small{font:500 11px var(--f-mono);color:var(--ink-soft)}
.status.soon{background:#d6455d}
.backlist{position:absolute;left:12px;top:12px;border:0;border-radius:999px;background:rgba(255,255,255,.85);font:600 12px var(--f-body);padding:7px 11px;cursor:pointer;z-index:1;display:none}
.panel .eyebrow.withback{margin-top:30px}

.toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;z-index:7;background:var(--ink);color:#fff;font-family:var(--f-display);font-size:22px;padding:10px 20px;border-radius:14px;transition:all .35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fallback{position:fixed;inset:0;display:grid;place-items:center;z-index:2;font-size:14px;color:var(--ink-soft)}

/* 정모 레이어 */
.brandcard .meetline{margin-top:2px}
.brandcard .meetline a{color:var(--ink-soft)}
.glabel .mb{font:600 10.5px var(--f-mono);background:var(--hold-yellow);color:var(--ink);border-radius:6px;padding:1px 5px;margin-left:5px;white-space:nowrap}
.glabel.big .mb{font-size:12px}
.meet{background:#f1eeff;border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px}
.meet h3{font:700 12px var(--f-body);letter-spacing:.06em;margin:0;color:#4b3fb0;display:flex;justify-content:space-between;gap:8px}
.meet h3 small{font:500 11px var(--f-body);letter-spacing:0;color:var(--ink-soft)}
.meet .slots{display:flex;gap:8px}
.meet .slot{flex:1;background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink-soft)}
.meet .slot b{display:block;font:600 17px var(--f-mono);color:var(--ink)}
.meet ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.meet li{display:grid;grid-template-columns:3.4em 1fr auto;gap:2px 8px;align-items:center;background:#fff;border-radius:9px;padding:7px 9px;font-size:12.5px}
.meet li .t{font:500 12px var(--f-mono);grid-row:span 2}
.meet li .ti{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meet li .cr{grid-column:2;font-size:11.5px;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meet li .cr a{color:inherit}
.meet li .j{font:500 12px var(--f-mono);grid-row:span 2;text-align:right}
.meet .fine{font-size:11px;color:var(--ink-soft);margin:0;line-height:1.5}
.ritem .mj{font:600 11px var(--f-mono);color:var(--ink);grid-row:span 2;text-align:right;white-space:nowrap}
.rlist .meetsum{display:flex;gap:6px;margin:8px 6px 4px}
.rlist .meetsum span{flex:1;background:var(--chalk);border-radius:9px;padding:6px 8px;font-size:11px;color:var(--ink-soft)}
.rlist .meetsum b{display:block;font:600 15px var(--f-mono);color:var(--ink)}
.rlist .meetnote{font-size:11px;color:var(--ink-soft);margin:10px 6px 0;line-height:1.5}
.rlist .meetnote a{color:var(--hold-blue)}
body.has-meet .rlist{top:calc(116px + env(safe-area-inset-top,0px))}


/* ---------- P0 패치: 내 주변 · 영업중 · 공유 ---------- */ /* P1 패치 적용 */ /* P2 패치 적용 */
.chip small{font:500 11px var(--f-mono);opacity:.7}
.chip svg{width:13px;height:13px;flex:none}
.chip.busy{opacity:.6;pointer-events:none}
.ostat{font:700 11px var(--f-body);border-radius:6px;padding:3px 7px;color:#fff;background:#14a37f}
.ostat.soon{background:#e58a00}
.ostat.off{background:#6c7194}
.ostat.maybe{background:#b07a00}
.ritem .os{font-weight:700;margin-right:5px}
.ritem .os.on{color:#14a37f}.ritem .os.soon{color:#c06f00}.ritem .os.off{color:#8a8fb0}.ritem .os.maybe{color:#b07a00}
.links a.share{background:var(--ink);color:#fff;box-shadow:none;cursor:pointer}
.links a.share:hover{background:#2c3466}
.mepin{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#3d7bff;border:3px solid #fff;box-sizing:border-box;box-shadow:0 0 0 0 rgba(61,123,255,.55),0 3px 10px rgba(0,0,0,.35);z-index:10002;pointer-events:none;animation:mepulse 1.8s infinite}
.mepin span{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#3d7bff;color:#fff;font:700 11px var(--f-body);border-radius:999px;padding:3px 8px;white-space:nowrap}
@keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(61,123,255,.55),0 3px 10px rgba(0,0,0,.35)}70%{box-shadow:0 0 0 16px rgba(61,123,255,0),0 3px 10px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(61,123,255,0),0 3px 10px rgba(0,0,0,.35)}}
@media (prefers-reduced-motion:reduce){.mepin{animation:none}}
@media (max-width:720px){body.has-meet .rlist{top:auto}}

/* ---------- P1 패치: 상세 필터 · 세팅 · 즐겨찾기 · 정모 기록 ---------- */
.chip .cnt{font:600 11px var(--f-mono);background:var(--hold-yellow);color:var(--ink);border-radius:99px;padding:1px 6px}
.fsheet{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--paper);border-radius:16px;box-shadow:0 24px 60px -20px rgba(27,33,68,.55);padding:14px 16px 16px;box-sizing:border-box;z-index:7}
.tools{position:fixed}
.fsheet h4{font:700 11px var(--f-body);letter-spacing:.06em;color:var(--ink-soft);margin:12px 0 6px}
.fsheet h4:first-of-type{margin-top:2px}
.fsheet .opts{display:flex;flex-wrap:wrap;gap:6px}
.fsheet .opts button{border:0;border-radius:999px;padding:7px 11px;font:600 12.5px var(--f-body);background:var(--chalk);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.fsheet .opts button small{font:500 10.5px var(--f-mono);color:var(--ink-soft)}
.fsheet .opts button[aria-pressed="true"]{background:var(--ink);color:#fff}
.fsheet .opts button[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
.fsheet .fine{font-size:11px;color:var(--ink-soft);line-height:1.5;margin:10px 0 0}

function inRing(x, z, r) { if (x < r.b[0] || x > r.b[1] || z < r.b[2] || z > r.b[3]) return false; const p = r.p; let c = false; for (let i=0,j=p.length-1;i<p.length;j=i++){ const [xi,zi]=p[i],[xj,zj]=p[j]; if (((zi>z)!=(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) c=!c; } return c; }

{

function makeClimber() {
  const grp = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: 0xffcfa6, roughness: .8 });
  const shirt = new THREE.MeshStandardMaterial({ color: 0xff5a5f, roughness: .7 });
  const pants = new THREE.MeshStandardMaterial({ color: 0x1b2144, roughness: .8 });
  const shoe = new THREE.MeshStandardMaterial({ color: 0xffc933, roughness: .6 });
  const hair = new THREE.MeshStandardMaterial({ color: 0x2b1d14, roughness: .9 });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(.17,.22,.1), shirt); torso.position.y = .34; grp.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.075, 12, 10), skin); head.position.y = .53; grp.add(head);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(.078, 12, 8, 0, Math.PI*2, 0, Math.PI/2), hair); cap.position.y = .54; grp.add(cap);
  const bag = new THREE.Mesh(new THREE.CylinderGeometry(.04,.035,.06,8), shoe); bag.position.set(0,.22,.07); grp.add(bag);
  const limb = (len, mat, x, y, shoeEnd) => {
    const pivot = new THREE.Group(); pivot.position.set(x, y, 0);
    const seg = new THREE.Mesh(new THREE.CapsuleGeometry(.028, len, 3, 6), mat); seg.position.y = -len/2; pivot.add(seg);
    if (shoeEnd) { const s = new THREE.Mesh(new THREE.BoxGeometry(.06,.04,.09), shoe); s.position.set(0, -len - .02, .02); pivot.add(s); }
    else { const h = new THREE.Mesh(new THREE.SphereGeometry(.03, 6, 6), skin); h.position.y = -len - .02; pivot.add(h); }
    grp.add(pivot); return pivot;
  };
  const armL = limb(.19, shirt, -.11, .43), armR = limb(.19, shirt, .11, .43);
  const legL = limb(.2, pants, -.05, .23, true), legR = limb(.2, pants, .05, .23, true);
  grp.traverse(o => { if (o.isMesh) o.castShadow = true; });
  grp.userData = { armL, armR, legL, legR, shirt };
  return grp;
}

    update(dt) { if (!mesh.visible) return; this.t += dt; parts.forEach((q, i) => { q.v.y -= 4.5 * dt; q.v.multiplyScalar(.985); q.p.addScaledVector(q.v, dt); q.r.x += dt * 6; q.r.y += dt * 4;

const CLIMB_T = REDUCED ? 0.01 : 3.4;
let climb = null; // { obj, t, phase }
function startClimb(obj) {
  climb = { obj, t: 0, phase: 'climb', done: false };
  climber.visible = true;
  climber.userData.shirt.color.set(obj.g._col === '#ffc933' ? '#3d7bff' : '#ffc933');
  obj.grp.add(climber);
  climber.position.set(0, 0, D/2 + .75); climber.rotation.set(0, 0, 0);
}
function updateClimb(dt) {
  if (!climb) return;
  climb.t += dt;
  const u = climber.userData; const t = climb.t;
  if (climb.phase === 'climb') {
    // 걸어와서(0.5s) 벽을 오른다
    if (t < .5) {
      const k = t / .5; climber.position.set(0, .08, D/2 + .75 - k * .55); climber.rotation.set(0, 0, 0);
      const s = Math.sin(t * 18); u.legL.rotation.x = s * .6; u.legR.rotation.x = -s * .6; u.armL.rotation.x = -s * .4; u.armR.rotation.x = s * .4;
    } else {
      const k = Math.min(1, (t - .5) / CLIMB_T);
      const step = k + Math.sin(k * Math.PI * 10) * .012;
      const y = .06 + step * (H * .96 - .55), z = D/2 + .2 + (y / H) * LEAN;
      climber.position.set(Math.sin(k * 7) * .12, y, z);
      climber.rotation.set(Math.atan2(LEAN, H), 0, 0);
      const ph = k * Math.PI * 10;
      u.armL.rotation.set(Math.PI - .35 + Math.sin(ph) * .45, 0, -.25);
      u.armR.rotation.set(Math.PI - .35 - Math.sin(ph) * .45, 0, .25);
      u.legL.rotation.set(.35 + Math.max(0, Math.sin(ph)) * .9, 0, -.3);
      u.legR.rotation.set(.35 + Math.max(0, -Math.sin(ph)) * .9, 0, .3);
      setProgress(k);
      if (k >= 1) { climb.phase = 'top'; climb.t = 0; }
    }
  } else if (climb.phase === 'top') {
    // 옥상으로 올라서기
    const k = Math.min(1, climb.t / .6);
    climber.position.set(0, THREE.MathUtils.lerp(H * .96 - .49, H + .14, k), THREE.MathUtils.lerp(D/2 + .2 + LEAN * .9, D/2 - .2, k));
    climber.rotation.set(0, 0, 0);
    u.legL.rotation.set(k * .2, 0, 0); u.legR.rotation.set(0, 0, 0);
    if (k >= 1) { climb.phase = 'cheer'; climb.t = 0; climber.rotation.set(0, Math.PI, 0);
      const w = new THREE.Vector3(); climber.getWorldPosition(w); w.y += .6; confetti.burst(w); showToast('완등!'); markSent(); }
  } else {
    const b = Math.abs(Math.sin(climb.t * 5));
    climber.position.y = H + .14 + b * .12;
    u.armL.rotation.set(Math.PI + Math.sin(climb.t * 10) * .3, 0, -.4);
    u.armR.rotation.set(Math.PI - Math.sin(climb.t * 10) * .3, 0, .4);
    u.legL.rotation.set(0, 0, -.12); u.legR.rotation.set(0, 0, .12);
    if (climb.t > 3) { u.armL.rotation.set(.1, 0, -.1); u.armR.rotation.set(Math.PI - .2 + Math.sin(climb.t * 6) * .35, 0, .3); climber.position.y = H + .14; }
  }
}

let travel = null, homeObj = null;
const tmpV = new THREE.Vector3();
function frontOf(o) { o.grp.updateMatrixWorld(); return o.grp.localToWorld(new THREE.Vector3(0, .08, D/2 + .75)); }
function startTravel(fromObj, toObj) {
  const from = new THREE.Vector3(); climber.getWorldPosition(from);
  scene.attach(climber); climber.rotation.set(0, 0, 0);
  const to = frontOf(toObj);
  const dist = Math.hypot(to.x - from.x, to.z - from.z);
  const run = dist < 14;
  const dur = REDUCED ? .01 : run ? .9 + dist * .13 : Math.min(6, 1.8 + Math.sqrt(dist) * .3);
  const hops = run ? Math.max(1, Math.round(dist / .9)) : Math.max(2, Math.min(7, Math.round(Math.sqrt(dist) / 2.6)));
  const hopH = run ? .07 : Math.min(70, Math.max(3, dist / hops * .42));
  const off = camera.position.clone().sub(controls.target);
  if (off.y < off.length() * .45) off.y = off.length() * .45;
  travel = { fromObj, o: toObj, from, to, dist, dur, t: 0, hops, hopH, run, dir: off.normalize(), L0: camera.position.distanceTo(controls.target), follow: true };
  climb = null; fly = null;
  climber.userData.shirt.color.set(toObj.g._col === '#ffc933' ? '#3d7bff' : '#ffc933');
  setClimbMsg(`${fromObj.g.name}에서 이동 중 · ${(dist / K * 111).toFixed(1)}km`);
}
function updateTravel(dt) {
  if (!travel) return;
  const tr = travel; tr.t += dt;
  const k = Math.min(1, tr.t / tr.dur);
  const kk = tr.run ? k : (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2) * .15 + k * .85;
  const x = THREE.MathUtils.lerp(tr.from.x, tr.to.x, kk), z = THREE.MathUtils.lerp(tr.from.z, tr.to.z, kk);
  const ph = kk * tr.hops, loc = ph - Math.floor(ph);
  const base = THREE.MathUtils.lerp(tr.from.y, tr.to.y, Math.min(1, kk * (tr.run ? 4 : 1.6)));
  const y = base + 4 * loc * (1 - loc) * tr.hopH * (k >= 1 ? 0 : 1);
  climber.position.set(x, y, z);
  climber.rotation.set(0, Math.atan2(tr.to.x - tr.from.x, tr.to.z - tr.from.z), 0);
  const u = climber.userData;
  if (tr.run || tr.hopH < 4) {
    const sw = Math.sin(tr.t * 18);
    u.legL.rotation.set(sw * .7, 0, 0); u.legR.rotation.set(-sw * .7, 0, 0); u.armL.rotation.set(-sw * .5, 0, -.1); u.armR.rotation.set(sw * .5, 0, .1);
  } else {
    const up = Math.sin(loc * Math.PI);
    u.armL.rotation.set(Math.PI - .5 * up, 0, -.5); u.armR.rotation.set(Math.PI - .5 * up, 0, .5);
    u.legL.rotation.set(.9 * up, 0, -.15); u.legR.rotation.set(-.4 + .9 * up, 0, .15);
  }
  setProgress(k);
  if (tr.follow) {
    const tgt = tmpV.set(x, Math.max(y * .5 + base * .5, base) + .8, z);
    const L = THREE.MathUtils.lerp(tr.L0, 11, k) + Math.sin(k * Math.PI) * Math.min(tr.dist * .55, 220);
    controls.target.lerp(tgt, Math.min(1, dt * 7));
    camera.position.lerp(tgt.clone().addScaledVector(tr.dir, L), Math.min(1, dt * 5));
  }
  if (k >= 1) {
    travel = null;
    const [target, pos] = gymView(tr.o); flyTo(target, pos, .9);
    startClimb(tr.o); setClimbMsg('클라이머 등반 중');
    showToast(tr.o.g.name + ' 도착');
  }
}

let fly = null;
function flyTo(target, pos, dur = 1.6) {
  if (REDUCED) dur = 0.01;
  fly = { t: 0, dur, p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target };
}
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function updateFly(dt) {
  if (!fly) return;
  fly.t += dt; const k = ease(Math.min(1, fly.t / fly.dur));
  // 멀리서 가까이 갈 때 살짝 떠오르는 궤적
  const lift = Math.sin(k * Math.PI) * Math.min(120, fly.p0.distanceTo(fly.p1) * .25);
  camera.position.lerpVectors(fly.p0, fly.p1, k); camera.position.y += lift;
  controls.target.lerpVectors(fly.t0, fly.t1, k);
  if (k >= 1) fly = null;
}
function viewBox(list, tilt = 1) {
  const xs = list.map(g => g._x), zs = list.map(g => g._z);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
  const c = new THREE.Vector3((minX+maxX)/2, 3.2, (minZ+maxZ)/2);
  const span = Math.max(maxX-minX, (maxZ-minZ) * 1.3, 18);
  const d = span * 1.25 * tilt + 12;
  return [c, c.clone().add(new THREE.Vector3(0, d * .78, d * .82))];
}

function priceWon(g) {
  const t = g.price_day; if (!t) return null;
  if (/^\s*무료/.test(t)) return 0;
  if (/1일권 없음|금액 미확인|1개월|월 회원제/.test(t)) return null;
  const m = t.match(/(\d{1,3}(?:,\d{3})+|\d{4,6})\s*원/) || t.match(/(\d{1,3}(?:,\d{3})+)/);

const pillarGeo = new THREE.CylinderGeometry(.26, .26, 1, 10); pillarGeo.translate(0, .5, 0);
const pillarDay = new THREE.MeshStandardMaterial({ color: 0xffc933, emissive: 0x7a5a00, emissiveIntensity: .35, roughness: .5 });

function buildPillars() {
  for (const o of gymObjs) {
    const m = meetOf(o.g); if (!m) continue;
    const grpP = new THREE.Group(); grpP.position.set(0, H + .14, 0); let y = 0;
    const [matDay, matEve] = pillarMats(o.g._col);
    for (const [s, mat] of [[m.day, matDay], [m.eve, matEve]]) {

}

  const mk = c => new THREE.MeshStandardMaterial({ color: c, emissive: c.clone().multiplyScalar(.35), emissiveIntensity: 1, roughness: .5 });

const addDays = (ymd, n) => new Date(Date.parse(ymd + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);

  for (let i = 0; i < list.length; i += 7) docs.push(...await Promise.all(list.slice(i, i + 7).map(d => d === LATEST_DATE ? MEET_DOCS.get(d) : fetchDay(d))));

  if (mineTab === 'done') {
    const regs = REGIONS.filter(r => r.f && r.key !== 'all').map(r => { const t = all.filter(r.f).length, n = done.filter(x => !isUnv(x.g) && r.f(x.g)).length; return { l: r.label, n, t }; }).filter(r => r.t);
    html += `<div class="prog"><div class="big"><b>${nDone}</b>/ ${all.length}곳 · 운영중 암장의 ${pct < 1 && nDone ? pct.toFixed(1) : Math.round(pct)}%</div><div class="bar"><span style="width:${Math.min(100, pct).toFixed(1)}%"></span></div>
      <div class="regs">${regs.map(r => `<span class="${r.n && r.n === r.t ? 'full' : ''}">${esc(r.l)} <b>${r.n}/${r.t}</b></span>`).join('')}</div></div>`;
    const list = done.sort((a, b) => (DONE_AT[b.g.id] || '').localeCompare(DONE_AT[a.g.id] || '') || a.g.name.localeCompare(b.g.name, 'ko'));
    html += list.length ? `<h3>최근 다녀온 순<span>${list.length}</span></h3><ul>` + list.map(({ g, i }) => `<li><button class="ritem" data-i="${i}" style="--c:${isUnv(g) ? '#b8bcd3' : g._col}" aria-current="${sel && sel.g === g}"><i></i><span class="nm">${esc(g.name)}${FAV.has(g.id) ? '<span class="mk">★</span>' : ''}</span><span class="dt">${esc(fmtVisit(DONE_AT[g.id]))}</span><span class="sub">${osHTML(g)}${esc(g.station || g.sigungu)}</span></button></li>`).join('') + '</ul>'
      : '<p class="tip">아직 기록이 없어요.<br>암장을 눌러 정보 패널의 <b>다녀왔어요</b>를 누르면 여기에 쌓이고, 지역별로 몇 곳을 깼는지 보여드려요.</p>';
  } else {
    const list = fav.sort((a, b) => a.g.name.localeCompare(b.g.name, 'ko'));
    html += list.length ? `<h3>즐겨찾기<span>${list.length}</span></h3><ul>` + list.map(({ g, i }) => `<li><button class="ritem" data-i="${i}" style="--c:${isUnv(g) ? '#b8bcd3' : g._col}" aria-current="${sel && sel.g === g}"><i></i><span class="nm">${esc(g.name)}${marks(g).replace('<span class="mk">★</span>', '')}</span><span class="pr">${state.me ? fmtKm(distKm(state.me, g)) : esc(prLabel(g))}</span><span class="sub">${osHTML(g)}${esc(g.station || g.sigungu)}</span></button></li>`).join('') + '</ul>'
      + '<p class="fine">지도에서 즐겨찾기만 보려면 위쪽 ‘★ 즐겨찾기’ 칩을 누르세요.</p>'
      : '<p class="tip">아직 즐겨찾기가 없어요.<br>암장 정보 패널의 <b>☆ 즐겨찾기</b>를 누르면 여기서 바로 찾아갈 수 있어요.</p>';
  }
  document.getElementById('rBody').innerHTML = html + '</div>';
}
document.getElementById('rBody').addEventListener('click', e => {
  const t = e.target.closest('[data-mtab]'); if (!t) return; e.stopPropagation();
  mineTab = t.dataset.mtab; renderMineList();
  if (mineTab === 'fav') { const l = GYMS.filter(g => FAV.has(g.id)); if (l.length) { const [c, p] = viewBox(l, 1); flyTo(c, p); } }
  else { const l = GYMS.filter(g => DONE.has(g.id)); if (l.length) { const [c, p] = viewBox(l, 1); flyTo(c, p); } }
});
updateMineBtn();
// 다른 서랍이 열리고 닫힐 때 버튼 눌림 상태 맞추기
new MutationObserver(updateMineBtn).observe(rlist, { attributes: true, attributeFilter: ['class'] });

/* ---------- P0: 영업 상태 표시 ---------- */
function ostatTag(g) { const st = openStatus(g); return st ? `<span class="ostat ${st.s === 'on' ? '' : st.s}" id="pOpen">${esc(st.label)}</span>` : (isUnv(g) ? '' : '<span class="tag" id="pOpen">운영시간 미확인</span>'); }
function osHTML(g) { const st = openStatus(g); if (!st) return ''; const w = { on: '영업중', soon: '곧 마감', off: st.label.startsWith('영업 전') ? st.label.replace('영업 전 · ', '') : '영업종료', maybe: '휴무 확인' }[st.s]; return `<b class="os ${st.s}">${esc(w)}</b>`; }
function toggleOpen() {
  state.open = !state.open; renderChips(); applyFilter();
  if (state.open) {
    if (!curList) openRegionList(curRegion === 'kr' ? 'all' : curRegion);
    const list = visibleGyms(); if (list.length && curList !== 'near') { const [c, p] = viewBox(list, 1); flyTo(c, p); }
    showToast(`영업중 ${visibleGyms().length}곳`);
  }
  if (sel) openPanel(sel.g);
}
// 1분마다 영업 상태 갱신
setInterval(() => { if (state.open) applyFilter(); renderChips(); const t = document.getElementById('pOpen'); if (t && sel) t.outerHTML = ostatTag(sel.g); }, 60e3);

/* ---------- P0: 내 주변 암장 ---------- */
let locating = false;
const distKm = (a, g) => Math.hypot((g.lat - a.lat) * 111, (g.lng - a.lng) * 111 * Math.cos(a.lat * Math.PI / 180));
const fmtKm = d => d < 1 ? Math.round(d * 1000) + 'm' : d < 10 ? d.toFixed(1) + 'km' : Math.round(d) + 'km';
const mePin = document.createElement('div'); mePin.className = 'mepin'; mePin.hidden = true; mePin.innerHTML = '<span>내 위치</span>'; document.getElementById('labels').append(mePin);
const meV = new THREE.Vector3();
function updateMePin() {
  if (!state.me) return;
  meV.set(toX(state.me.lng), 3.25, toZ(state.me.lat)).project(camera);
  const on = meV.z < 1 && Math.abs(meV.x) < 1.2 && Math.abs(meV.y) < 1.2; mePin.hidden = !on;
  if (on) mePin.style.transform = `translate(${(meV.x * .5 + .5) * innerWidth}px,${(-meV.y * .5 + .5) * innerHeight}px)`;
}
function locateMe() {
  if (!navigator.geolocation) { showToast('위치 기능이 없어요'); return; }
  if (locating) return;
  locating = true; renderChips();
  navigator.geolocation.getCurrentPosition(p => {
    locating = false;
    state.me = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    closePanel(); openRegionList('near'); renderChips();
    const near = GYMS.filter(passes).sort((a, b) => distKm(state.me, a) - distKm(state.me, b)).slice(0, 5);
    const pts = [{ _x: toX(state.me.lng), _z: toZ(state.me.lat) }, ...near.filter(g => distKm(state.me, g) < 15)];
    const [c, pos] = viewBox(pts, 1); flyTo(c, pos);
  }, err => {
    locating = false; renderChips();
    showToast(err.code === 1 ? '위치 권한을 허용해 주세요' : '위치를 찾지 못했어요');
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 120000 });
}
function renderNearList() {
  const me = state.me; if (!me) return;
  const list = GYMS.map((g, i) => ({ g, i, d: distKm(me, g) })).filter(x => passes(x.g)).sort((a, b) => a.d - b.d).slice(0, 20);
  document.getElementById('rTitle').textContent = '내 주변 암장';
  const far = list.length && list[0].d > 40;
  document.getElementById('rMeta').innerHTML = `가까운 순 <b>${list.length}</b>곳 · 직선거리${state.type ? ` · ${esc(TYPE_CHIPS.find(t => t[1] === state.type)[0])}만` : ''}${state.meet ? ' · 정모 있는 곳만' : ''}${state.open ? ' · 지금 영업중만' : ''}${fCount() ? ` · 필터 ${fCount()}개` : ''}${me.acc > 1500 ? '<br>위치 정확도가 낮아요(±' + fmtKm(me.acc / 1000) + ')' : ''}${far ? '<br>서울·경기 밖이라 가장 가까운 곳도 멀어요' : ''}`;
  document.getElementById('rBody').innerHTML = list.length ? '<ul>' + list.map(({ g, i, d }) => {
    const badge = g.status === '폐업예정' ? '<span class="badge soon">폐업예정</span>' : isUnv(g) ? '<span class="badge">확인필요</span>' : '';
    const mt = state.meet && meetOf(g);
    return `<li><button class="ritem" data-i="${i}" style="--c:${isUnv(g) ? '#b8bcd3' : g._col}" aria-current="${sel && sel.g === g}"><i></i><span class="nm">${esc(g.name)}${badge}${marks(g)}</span><span class="pr">${fmtKm(d)}${mt ? `<br>${mt.total.joined}명` : ''}</span><span class="sub">${osHTML(g)}${esc(g.station || g.sigungu)}</span></button></li>`;
  }).join('') + '</ul>' : '<p class="empty">이 조건에 맞는 암장이 없어요. 위쪽 필터를 바꿔 보세요.</p>';
}

/* ---------- P0: 암장별 공유 링크 (map.html#SEL-001) ---------- */
function setHash(h) { try { if ((location.hash || '') !== h) history.replaceState(null, '', location.pathname + location.search + h); } catch (e) {} }
function gymIndexFromHash() { const id = decodeURIComponentSafe(location.hash.slice(1)); return id && id !== 'meet' ? GYMS.findIndex(g => g.id === id) : -1; }
async function shareGym(id) {
  const g = GYMS.find(x => x.id === id); if (!g) return;
  const url = location.origin + location.pathname + '#' + id;
  if (navigator.share && matchMedia('(pointer:coarse)').matches) { try { await navigator.share({ title: g.name, text: `${g.name} · 서울·경기 암장 지도`, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); showToast('링크 복사!'); return; } catch (e) {}
  const t = document.createElement('textarea'); t.value = url; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.append(t); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove();
  showToast(ok ? '링크 복사!' : '복사하지 못했어요');
}
addEventListener('hashchange', () => { const i = gymIndexFromHash(); if (i >= 0 && (!sel || sel.g !== GYMS[i])) select(i); });

/* ---------- 시작 ---------- */
document.getElementById('cOpen').textContent = GYMS.filter(g => !isUnv(g)).length;
document.getElementById('cUnv').textContent = GYMS.filter(isUnv).length;
renderChips(); applyFilter();
{ // 전국에서 수도권으로 내려오는 인트로
  const list = GYMS.filter(g => !isUnv(g)); const [c, p] = viewBox(list, .9);
  const c0 = new THREE.Vector3(toX(127.7), 0, toZ(35.9));
  camera.position.copy(c0).add(new THREE.Vector3(0, 1500, 1350)); controls.target.copy(c0);
  setTimeout(() => flyTo(c, p, 2.6), 350);
}
document.getElementById('loading').remove();
loadMeet();
{ const i = gymIndexFromHash(); if (i >= 0) setTimeout(() => select(i), 1200); }

function updateViewOffset() {
  const w = innerWidth, h = innerHeight;
  const pOpen = panel.classList.contains('open'), lOpen = rlist.classList.contains('open');
  if (!pOpen && !lOpen) { camera.clearViewOffset(); return; }
  // 패널과 목록에 가리지 않도록 화면 중심을 옮긴다
  if (w <= 720) { camera.setViewOffset(w, h, 0, Math.round(h * .22), w, h); return; }
  const right = pOpen ? Math.min(400, w * .4) + 12 : 0, left = lOpen ? Math.min(330, w * .35) + 16 : 0;
  camera.setViewOffset(w, h, Math.round((right - left) / 2), 0, w, h);
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 720 ? 50 : 38; camera.updateProjectionMatrix(); updateViewOffset(); }
addEventListener('resize', resize); resize();

const clock = new THREE.Clock(); let seaT = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1);
  for (let k = 0, n = window.__mapSpeed || 1; k < n; k++) { updateFly(dt); updateTravel(dt); updateClimb(dt); confetti.update(dt); }
  controls.update(); updateSun();
  { const cd = camera.position.distanceTo(controls.target); scene.fog.near = cd * 1.1; scene.fog.far = cd * 3.2 + 200; }
  seaT += dt;
  if (!REDUCED) {
    const a = seaGeo.attributes.position.array;
    for (let i = 0; i < a.length; i += 3) a[i+1] = seaBase[i+1] + Math.sin(seaBase[i] * .01 + seaT * .9) * 1.1 + Math.cos(seaBase[i+2] * .012 + seaT * .7) * 1.1;
    seaGeo.attributes.position.needsUpdate = true;
    for (const c of clouds) { c.position.x += c.userData.v * dt * 4; if (c.position.x > toX(131)) c.position.x = toX(124); }
    for (const o of gymObjs) if (o === hov && o !== sel) o.grp.scale.y = 1 + Math.sin(seaT * 8) * .02; else if (o.grp.scale.y !== 1) o.grp.scale.y = 1;
  }
  renderer.render(scene, camera);
  updateLabels(); updateMePin();
});

</script>
</body>
